[workspace]
members = [
    "crates/core",
    "crates/game",
    "crates/navigation",
    "crates/inventory",
    "crates/combat",
    "crates/party",
    "crates/world",
    "crates/dialogue",
    "crates/scripting",
    "crates/botany",
    "crates/garden",
    "crates/persistence",
    "crates/tools",
    "crates/mcp-server",
    "crates/plantgl",
    "crates/web-demo",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ron = "0.8"
fyrox = "0.36"
nalgebra = "0.33"
rand = "0.8"

# The ALSA stub is active for every build in this workspace, which is why no
# `libasound2-dev` is needed to compile the game on Linux.  The stub makes
# snd_pcm_open return an error so Fyrox gracefully skips audio initialisation;
# everything else (rendering, input, physics) works normally.
#
# The trade-off is that there is no sound, in any build, including release.
# To get audio back, delete the [patch] section below and install the ALSA
# headers (`libasound2-dev` on Debian/Ubuntu, `alsa-lib-devel` on Fedora).

[patch.crates-io]
alsa-sys = { path = "crates/alsa-sys-stub" }
