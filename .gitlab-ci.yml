# Builds and publishes the plant generator demo in `web/` to GitLab Pages.
#
# The site is `crates/web-demo` compiled to `wasm32-unknown-unknown` plus four
# static files, so the pipeline needs nothing but a Rust toolchain — no
# wasm-bindgen, no wasm-pack, no Node. `web/build.sh` is the same script a
# contributor runs locally, so what CI publishes is what they saw.

stages:
  - test
  - deploy

variables:
  # Cargo's download cache has to sit inside the project directory for GitLab
  # to be allowed to cache it between pipelines.
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  # A backtrace is worth more than the bytes it costs when a job fails.
  RUST_BACKTRACE: "1"

default:
  # `rust:1` tracks the current 1.x release. The lockfile already requires 1.85
  # or newer, so pinning a patch release would mean editing this file every
  # time a dependency raises its `rust-version`.
  image: rust:1-slim
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/index
      - .cargo-home/registry/cache
      - target

# The wasm boundary the page decodes, checked where a mistake is a red
# pipeline rather than a blank canvas.
test:web-demo:
  stage: test
  before_script:
    - rustup component add clippy
  script:
    - cargo test --package apothecarys-web-demo
    - cargo clippy --package apothecarys-web-demo --all-targets -- -D warnings

pages:
  stage: deploy
  script:
    - rustup target add wasm32-unknown-unknown
    - web/build.sh public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
